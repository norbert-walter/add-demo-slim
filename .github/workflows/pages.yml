# GitHub Pages: veröffentlicht den Ordner startup/ (Startseite für QR-Code und NFC-Tag am Gerät).
# Einmalig einschalten: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Adresse: https://norbert-walter.github.io/add-demo-slim/
# Versionen 24.11.2026: upload-pages-artifact v5 (upload-artifact v7) mit deploy-pages v5 (Node 24).
# Nach einem Fehler neu über "Run workflow" starten statt "Re-run".
name: Startseite veröffentlichen

on:
  push:
    branches: [master]
    paths: ['startup/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Seite zusammenstellen (nur HTML, SVG, Schriften)
        run: |
          mkdir -p _site/fonts
          cp startup/index.html startup/*.svg _site/
          cp startup/fonts/* _site/fonts/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
