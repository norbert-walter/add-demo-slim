; ==============================================================
; platformio.ini — ADD Demo System (Demoanlage ADD Slim, Pflichtenheft V1.7)
; Board: MKS DLC32 V2.1 (ESP32-WROOM-32U, 4 MB flash)
; Toolchain: pioarduino (Arduino Core 3.x / ESP-IDF 5.x) – required for the
;            FastAccelStepper I2S_MUX driver (ESP-IDF >= 5.3).
; ==============================================================
;
; Environments
;   smoketest      Sprint 0a: hardware/toolchain smoketest (src/smoketest only)
;   firmware       production firmware (everything except src/smoketest)
;   firmware-debug same with verbose logging
;   firmware-partial  compile check for intermediate sprints: links even if
;                  functions of later sprints are still missing (NEVER flash it)
;   native         host unit tests of src/logic (no ESP32 needed)
;   esp32-test     on-target tests (test/embedded)
;
; Common commands
;   pio test -e native                         all host tests
;   pio test -e native -f native/test_safety_logic
;   pio run  -e firmware -s                    build quietly (only warnings/errors)
;   pio run  -e firmware -t upload             flash      (ONLY after user approval)
;   pio run  -e firmware -t uploadfs           flash SPIFFS (data/)
;   pio run  -e smoketest                      build smoketest
;   pio run  -e smoketest -t upload            flash smoketest
;   pio device monitor -e smoketest --echo     serial terminal for the smoketest (shows typed input)
; ==============================================================

[platformio]
default_envs = firmware

[env]
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 115200          ; smoketest 0a: long USB cable, CH340 (921600 unreliable)
upload_port     = /dev/ttyUSB0    ; flash PC (Dell); override with --upload-port elsewhere
monitor_port    = /dev/ttyUSB0
test_port       = /dev/ttyUSB0

; ---------------------------------------------------------------- ESP32 base
[esp32_base]
platform               = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board                  = esp32dev
framework              = arduino
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
build_flags            =
    -I src
    -DCORE_DEBUG_LEVEL=1
lib_deps               =
    ; pinned commit of FastAccelStepper master (2.0.0, I2S_MUX + i2sMuxSetBit)
    https://github.com/gin66/FastAccelStepper.git#96459ed15a3c7d9927f561d2edb72cc7edbbbe8a
    lovyan03/LovyanGFX    @ 1.2.32
    bblanchon/ArduinoJson @ 7.4.3

; ---------------------------------------------------------------- Sprint 0a
[env:smoketest]
extends          = esp32_base
build_src_filter = -<*> +<smoketest/>

; ---------------------------------------------------------------- firmware
[env:firmware]
extends          = esp32_base
build_src_filter = +<*> -<smoketest/>

[env:firmware-debug]
extends          = env:firmware
build_type       = debug
build_flags      =
    -I src
    -DCORE_DEBUG_LEVEL=4
    -DDEBUG_BUILD

; Intermediate sprints: proves that everything written so far compiles.
; Unresolved symbols of later sprints are ignored at link time. NEVER flash.
[env:firmware-partial]
extends          = env:firmware
build_flags      =
    -I src
    -DCORE_DEBUG_LEVEL=1
    -Wl,--unresolved-symbols=ignore-all

; ---------------------------------------------------------------- host tests
[env:native]
platform         = native
test_framework   = unity
test_filter      = native/*
test_build_src   = yes
build_src_filter = -<*> +<logic/>
build_flags      =
    -std=c++17
    -I src
    -I test/native/freertos_shim   ; only for test_command_queue; guarded by #error elsewhere
    -pthread
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DUNITY_INCLUDE_DOUBLE
lib_deps         =
    bblanchon/ArduinoJson @ 7.4.3

; ---------------------------------------------------------------- target tests
; Flashes the board and may switch outputs: ONLY after user approval.
[env:esp32-test]
extends          = esp32_base
test_framework   = unity
test_filter      = embedded/*
test_build_src   = yes
build_src_filter = +<*> -<smoketest/> -<main.cpp>
